<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="435" viewBox="0 0 1200 435" role="img" aria-label="Douaa EL ARIF — AI and Software Engineering, with animated portrait on the right.">
<defs>
<linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090F26"/><stop offset=".56" stop-color="#1B1543"/><stop offset="1" stop-color="#0A2433"/></linearGradient>
<linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FF70C8"/><stop offset=".45" stop-color="#C39AFE"/><stop offset="1" stop-color="#54E8F7"/></linearGradient>
<linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF86D4"/><stop offset=".52" stop-color="#9A85FE"/><stop offset="1" stop-color="#5EE7E9"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#9B63EC" stop-opacity=".52"/><stop offset="1" stop-color="#9B63EC" stop-opacity="0"/></radialGradient>
<clipPath id="portrait"><rect x="857" y="60" width="276" height="290" rx="20"/></clipPath>
<pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#B2A1FF" stroke-opacity=".085" stroke-width="1"/></pattern>
</defs>
<style>
@keyframes breath { 0%,100%{opacity:.55}50%{opacity:1} }
@keyframes line { to {stroke-dashoffset:-520} }
@keyframes rise { 0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)} }
.pulse{animation:breath 3.4s ease-in-out infinite}
.travel{stroke-dasharray:40 450;animation:line 9s linear infinite}
.float{animation:rise 6s ease-in-out infinite}
text{font-family:'DejaVu Sans',Arial,sans-serif}
</style>
<rect width="1200" height="435" rx="22" fill="url(#background)"/>
<rect width="1200" height="435" fill="url(#grid)"/>
<circle cx="1010" cy="210" r="320" fill="url(#glow)"/>
<circle cx="180" cy="0" r="200" fill="url(#glow)" opacity=".25"/>
<path d="M48 400H1150" stroke="#785ED2" stroke-width="1" opacity=".55"/>
<path d="M48 400H1150" stroke="url(#name)" stroke-width="2.6" class="travel"/>
<g fill="none" stroke="#A49BF0" opacity=".23"><path d="M48 88H715"/><path d="M48 358H705"/></g>
<rect x="49" y="31" width="265" height="35" rx="17" fill="#2A2452" stroke="#6353AB" stroke-width="1"/>
<circle cx="68" cy="48" r="5" fill="#61F1DE" class="pulse"/>
<text x="82" y="53" fill="#D8D0FF" font-size="13" font-weight="bold" letter-spacing="1">2027 / AI PORTFOLIO</text>
<text x="48" y="153" fill="#FFFFFF" font-size="79" font-weight="900">DOUAA</text>
<text x="48" y="236" fill="url(#name)" font-size="79" font-weight="900">EL ARIF</text>
<text x="51" y="285" fill="#EAEBFF" font-size="20" font-weight="bold" letter-spacing="2">AI · MACHINE LEARNING · SOFTWARE</text>
<text x="51" y="319" fill="#A9B5DD" font-size="19">Building intelligent, secure &amp; useful software.</text>
<rect x="49" y="331" width="320" height="42" rx="12" fill="#342351" stroke="#CF6FCD" stroke-width="1.4"/>
<circle cx="70" cy="352" r="5" fill="#69F0D0" class="pulse"/>
<text x="86" y="359" fill="#F8E3FF" font-size="14" font-weight="bold">OPEN TO PFE 2027 · 6 MONTHS</text>
<g class="float">
<rect x="845" y="48" width="300" height="314" rx="28" fill="#211B4B" stroke="url(#border)" stroke-width="4"/>
<rect x="851" y="54" width="288" height="302" rx="24" fill="#FFB2EC" opacity=".15"/>
<image x="857" y="60" width="276" height="290" href="data:image/webp;base64," preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait)"/>
<rect x="857" y="60" width="276" height="290" rx="20" stroke="#EBC3FF" stroke-opacity=".45" stroke-width="2" fill="none"/>
</g>
<rect x="910" y="355" width="173" height="29" rx="14" fill="#1B103C" stroke="#B084FB" stroke-width="1"/>
<text x="996" y="375" text-anchor="middle" fill="#F5E9FF" font-size="13" font-weight="bold">DOUAA / AI ENGINEER</text>
<g class="pulse"><circle cx="822" cy="70" r="3.5" fill="#FF8EDA"/><circle cx="1160" cy="113" r="4" fill="#74EFFF"/><path d="M1173 304v12m-6-6h12" stroke="#FF8EDA" stroke-width="2"/></g>
</svg>